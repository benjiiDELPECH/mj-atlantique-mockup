<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Avant / après — site de l'étude</title>
<style>
:root{--navy:#001656;--gold:#b8923f;--ink:#1a2230;--mid:#5b6472;--soft:#f4f6f9;--line:#e3e7ee}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.6 -apple-system,'Segoe UI',Roboto,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:28px 16px;text-align:center;border-bottom:1px solid var(--gold)}
header h1{margin:0;font:400 26px/1.25 Georgia,'Times New Roman',serif}header p{margin:6px 0 0;color:rgba(255,255,255,.8);font-size:14px}
main{max-width:1200px;margin:0 auto;padding:24px 16px 48px}
h2{font:400 22px/1.3 Georgia,serif;color:var(--navy);border-bottom:1px solid var(--gold);padding-bottom:8px;margin:32px 0 16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
figure{margin:0;background:#fff;border:1px solid var(--line);padding:10px}
figcaption{font-weight:600;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--mid);margin-bottom:8px}
img{width:100%;height:auto;display:block}a{color:var(--navy)}
@media(max-width:760px){.pair{grid-template-columns:1fr}}
.note{color:var(--mid);font-size:13px;text-align:center;margin-top:32px}
</style></head><body>
<header><h1>Le site actuel, aux couleurs du nouveau</h1><p>Essai réalisé sur ordinateur — rien n'a été modifié sur le site en ligne.</p></header>
<main>
<h2>Page d'accueil</h2>
<div class="pair"><figure><figcaption>Avant</figcaption><a href="1-accueil-avant.jpg"><img src="1-accueil-avant.jpg" alt="Page d'accueil actuelle"></a></figure>
<figure><figcaption>Après</figcaption><a href="2-accueil-apres.jpg"><img src="2-accueil-apres.jpg" alt="Page d'accueil habillée"></a></figure></div>
<h2>Recherche d'actifs</h2>
<div class="pair"><figure><figcaption>Avant</figcaption><a href="3-actifs-avant.jpg"><img src="3-actifs-avant.jpg" alt="Recherche d'actifs actuelle"></a></figure>
<figure><figcaption>Après</figcaption><a href="4-actifs-apres.jpg"><img src="4-actifs-apres.jpg" alt="Recherche d'actifs en fiches"></a></figure></div>
<p class="note">Cliquez sur une image pour l'agrandir. Nouvelle page d'accueil : <a href="/">mj-atlantique.pages.dev</a></p>
</main></body></html>
