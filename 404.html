<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — SCP Delphine Raymond</title>
<meta name="theme-color" content="#001656">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23001656'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='17' fill='%23b8923f' text-anchor='middle'%3EDR%3C/text%3E%3C/svg%3E">
<!-- Chemins absolus : la page est servie pour n'importe quelle adresse inconnue, même profonde. -->
<link rel="stylesheet" href="/fonts/raleway.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#001656;--gold:#b8923f;--font:'Raleway',-apple-system,'Segoe UI',Roboto,system-ui,sans-serif}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--navy);color:#fff;font-size:16px;line-height:1.6;min-height:100vh;display:flex;align-items:center;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:640px;margin:0 auto;padding:48px 16px}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:48px}
.brand-seal{width:46px;height:46px;border:1px solid var(--gold);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:Georgia,'Times New Roman',serif;font-size:20px;color:var(--gold)}
.brand-name{font-size:17px;font-weight:700;letter-spacing:.5px;line-height:1.15}
.brand-name span{display:block;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.8);margin-top:2px}
.kick{font-size:12.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
h1{font-size:32px;line-height:1.2;margin-bottom:16px}
p{color:rgba(255,255,255,.88);margin-bottom:28px}
nav{display:flex;flex-wrap:wrap;gap:12px}
nav a{display:inline-block;padding:12px 20px;border:1px solid rgba(255,255,255,.5);border-radius:4px;color:#fff;text-decoration:none;font-weight:600}
nav a:first-child{background:#fff;color:var(--navy);border-color:#fff}
nav a:hover,nav a:focus-visible{border-color:var(--gold);outline:none}
</style>
</head>
<body>
<main>
  <div class="brand"><div class="brand-seal" aria-hidden="true">DR</div><div class="brand-name">SCP Delphine Raymond<span>Mandataire judiciaire</span></div></div>
  <div class="kick">Erreur 404</div>
  <h1>Cette page est introuvable</h1>
  <p>L'adresse demandée n'existe pas ou a changé. Les informations de l'étude restent accessibles depuis l'accueil.</p>
  <nav aria-label="Pages du site">
    <a href="/">Retour à l'accueil</a>
    <a href="/etude">L'étude</a>
    <a href="/contact">Contact</a>
  </nav>
</main>
</body>
</html>
